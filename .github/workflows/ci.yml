name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coursepilot
          POSTGRES_PASSWORD: coursepilot
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U coursepilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=app --cov=scheduler --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The production image: builds, migrates a fresh database, serves the pages and the API.
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coursepilot
          POSTGRES_PASSWORD: coursepilot
          POSTGRES_DB: coursepilot
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U coursepilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coursepilot:ci .
      - name: Start the image as production would
        run: |
          docker run -d --name app --network host -e PORT=8000 \
            -e DATABASE_URL=postgresql://coursepilot:coursepilot@localhost:5433/coursepilot \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e CALENDAR_LINK_KEY="$(openssl rand -base64 32)" \
            coursepilot:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health/ready && break; sleep 2; done
      - name: Check pages, assets, API and headers
        run: |
          curl -fs localhost:8000/health/ready
          curl -fs localhost:8000/dashboard | grep -q '<div id="root">'
          curl -fsI localhost:8000/dashboard | grep -qi "content-security-policy: default-src 'self'"
          curl -fsI localhost:8000/dashboard | grep -qi "strict-transport-security"
          asset=$(curl -fs localhost:8000/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -fsI "localhost:8000$asset" | grep -qi "immutable"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/users/me)" = 401
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser journeys against the image
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker logs app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
