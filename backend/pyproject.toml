[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coursepilot-backend"
version = "0.1.0"
description = "API and scheduling engine for CoursePilot"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "tzdata>=2024.2",
    "icalendar>=7.3,<8",
    "recurring-ical-events>=3.8,<4",
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "httpx2>=2,<3",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "scheduler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A test whose parameters come out empty must fail, not silently skip.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = [
    "B008", # FastAPI's Depends() in default arguments is idiomatic.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # Tests use assert and fake credentials.

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app", "scheduler"]
